name: Build Suppersun APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cmd/gui/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/gui-build.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r23b
        run: |
          cd cmd/gui
          fyne package -os android \
            -app-id com.suppersun.app \
            -name Suppersun \
            -icon ${{ github.workspace }}/icon.png
          mv Suppersun.apk ${{ github.workspace }}/Suppersun.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suppersun-android
          path: Suppersun.apk
